name: Next.js Client Bundle Size Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'client/**'  # Only run on changes to client folder

jobs:
  analyze:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Checkout base branch for comparison
        run: git fetch origin ${{ github.base_ref }}:${{ github.base_ref }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'  # Specify the lock file path
          
      - name: Install dependencies in client directory
        run: |
          cd client
          npm ci
        
      - name: Build and analyze current PR
        run: |
          # Navigate to client directory
          cd client
          
          # Add bundle analyzer plugin
          npm install --save-dev @next/bundle-analyzer
          
          # Create bundle analyzer config
          cat > analyze-bundle.js << 'EOL'
          const withBundleAnalyzer = require('@next/bundle-analyzer')({
            enabled: true,
            openAnalyzer: false,
          });
          
          const nextConfig = require('./next.config.js');
          
          module.exports = withBundleAnalyzer(
            typeof nextConfig === 'function' ? nextConfig : nextConfig
          );
          EOL
          
          # Build with bundle analyzer
          NEXT_CONFIG_FILE=analyze-bundle.js NODE_ENV=production npm run build
          
          # Save PR bundle stats
          mkdir -p .next/analyze-result/pr
          find .next/analyze -name "*.html" -exec cp {} .next/analyze-result/pr/ \;
          find .next/analyze -name "*.json" -exec cp {} .next/analyze-result/pr/ \;
          
          # Extract page sizes for comparison
          find .next/static/chunks/pages -name "*.js" | sort | xargs stat -c "%s %n" > .next/analyze-result/pr-sizes.txt
      
      - name: Build and analyze base branch
        run: |
          # Checkout base branch
          git checkout ${{ github.base_ref }}
          
          # Navigate to client directory
          cd client
          
          # Clear previous build
          rm -rf .next
          
          # Install dependencies for base branch
          npm ci
          
          #